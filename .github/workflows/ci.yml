name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic tests
        run: python3 tests/run_tests.py
      - name: Compile scripts
        run: python3 -m py_compile scripts/*.py tests/run_tests.py
      - name: Validate eval JSON
        run: python3 -m json.tool evals/evals.json > /dev/null
      - name: Reject common private artifacts
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)|\.(csv|xlsx|vtt|pyc)$|(^|/)__pycache__/' ; then
            echo 'Private or generated artifact detected.'
            exit 1
          fi
          if git grep -nEI '/Users/|/var/folders/|AIza[0-9A-Za-z_-]{20,}|gho_[0-9A-Za-z_]+' -- ':!.github/workflows/ci.yml'; then
            echo 'Potential private path or credential detected.'
            exit 1
          fi
