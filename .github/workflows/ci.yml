name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic tests
        run: python3 tests/run_tests.py
      - name: Compile scripts
        run: python3 -m py_compile scripts/*.py tests/run_tests.py
      - name: Validate eval JSON
        run: python3 -m json.tool evals/evals.json > /dev/null
      - name: Reject common private artifacts
        shell: bash
        run: |
          if find . -type f \( -name '.env' -o -name '*.csv' -o -name '*.xlsx' -o -name '*.vtt' -o -name '*.pyc' \) -print -quit | grep -q .; then
            echo 'Private or generated artifact detected.'
            exit 1
          fi
          if grep -RIE '/Users/|/var/folders/|AIza[0-9A-Za-z_-]{20,}|gho_[0-9A-Za-z_]+' . --exclude-dir=.git; then
            echo 'Potential private path or credential detected.'
            exit 1
          fi
